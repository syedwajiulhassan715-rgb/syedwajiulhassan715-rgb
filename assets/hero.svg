<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Waji Ul Hassan Syed, AI engineer">
<defs>
  <clipPath id="card"><rect width="1200" height="380" rx="22"/></clipPath>
  <radialGradient id="b1"><stop offset="0" stop-color="#4F7CFF" stop-opacity=".45"/><stop offset="1" stop-color="#4F7CFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="b2"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".28"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
  <radialGradient id="b3"><stop offset="0" stop-color="#A78BFA" stop-opacity=".3"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#94a3b8" fill-opacity=".14"/></pattern>
  <linearGradient id="name" x1="0" x2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#c7d2fe"/><stop offset="1" stop-color="#4F7CFF"/>
  </linearGradient>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .f{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
    .d1{animation-delay:.15s} .d2{animation-delay:.45s} .d3{animation-delay:.75s} .d4{animation-delay:1.05s} .d5{animation-delay:1.35s}
    @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .pulse{animation:pulse 2.4s ease-out infinite;transform-origin:975px 190px;transform-box:view-box}
    .pulse2{animation-delay:1.2s}
    @keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
    .blink{animation:blink 1.6s ease-in-out infinite}
    @keyframes blink{50%{opacity:.25}}
  </style>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="380" fill="#0b1020"/>
  <circle r="300" fill="url(#b1)"><animateTransform attributeName="transform" type="translate" values="180,40;420,140;260,320;180,40" dur="18s" repeatCount="indefinite"/></circle>
  <circle r="260" fill="url(#b2)"><animateTransform attributeName="transform" type="translate" values="1000,330;760,240;1080,80;1000,330" dur="16s" repeatCount="indefinite"/></circle>
  <circle r="240" fill="url(#b3)"><animateTransform attributeName="transform" type="translate" values="640,-20;900,60;560,120;640,-20" dur="20s" repeatCount="indefinite"/></circle>
  <rect width="1200" height="380" fill="url(#dots)"/>

  <g class="f d1"><text x="72" y="104" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#2DD4BF">&gt; hello world, I'm</text></g>
  <g class="f d2"><text x="70" y="172" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="url(#name)" letter-spacing="-1">Waji Ul Hassan Syed</text></g>
  <g class="f d3"><text x="72" y="218" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94a3b8">AI Engineer  ·  Senior @ JKU Linz  ·  Vienna, Austria</text></g>
  <g class="f d4"><g><rect x="72" y="252" width="159.0" height="32" rx="16" fill="#4F7CFF" fill-opacity=".12" stroke="#4F7CFF" stroke-opacity=".6"/><text x="151.5" y="273" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#4F7CFF">Agentic systems</text></g><g><rect x="241.0" y="252" width="116.0" height="32" rx="16" fill="#2DD4BF" fill-opacity=".12" stroke="#2DD4BF" stroke-opacity=".6"/><text x="299.0" y="273" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2DD4BF">Applied ML</text></g><g><rect x="367.0" y="252" width="150.39999999999998" height="32" rx="16" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".6"/><text x="442.2" y="273" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#A78BFA">VLA / Robotics</text></g><g><rect x="527.4" y="252" width="141.8" height="32" rx="16" fill="#4F7CFF" fill-opacity=".12" stroke="#4F7CFF" stroke-opacity=".6"/><text x="598.3" y="273" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#4F7CFF">Data analysis</text></g></g>
  <g class="f d5">
    <circle cx="80" cy="327" r="5" fill="#22c55e"/><circle cx="80" cy="327" r="5" fill="#22c55e" class="blink" filter="url(#glow)"/>
    <text x="96" y="332" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#cbd5e1">building systems that show their evidence</text>
  </g>

  <g class="f d3">
    <circle cx="975" cy="190" r="125" fill="none" stroke="#1e293b" stroke-width="22" stroke-opacity=".5"/>
    <path id="e0" d="M975,65 A125,125 0 0 1 1100,190" fill="none" stroke="#334155" stroke-width="1.5"/><path id="e1" d="M1100,190 A125,125 0 0 1 975,315" fill="none" stroke="#334155" stroke-width="1.5"/><path id="e2" d="M975,315 A125,125 0 0 1 850,190" fill="none" stroke="#334155" stroke-width="1.5"/><path id="e3" d="M850,190 A125,125 0 0 1 975,65" fill="none" stroke="#334155" stroke-width="1.5"/>
    <line x1="975" y1="190" x2="975" y2="65" stroke="#4F7CFF" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line><line x1="975" y1="190" x2="1100" y2="190" stroke="#2DD4BF" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line><line x1="975" y1="190" x2="975" y2="315" stroke="#A78BFA" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line><line x1="975" y1="190" x2="850" y2="190" stroke="#4F7CFF" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line>
    <circle cx="975" cy="190" r="30" fill="#4F7CFF" fill-opacity=".25" class="pulse"/>
    <circle cx="975" cy="190" r="30" fill="#4F7CFF" fill-opacity=".25" class="pulse pulse2"/>
    <circle cx="975" cy="190" r="34" fill="#0f172a" stroke="#4F7CFF" stroke-width="2"/>
    <text x="975" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#ffffff">agent</text>
    <circle r="4" fill="#4F7CFF" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.0s;e0m.end+4.8s" fill="freeze" id="e0m"><mpath href="#e0"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="0.0s;e0m.begin" fill="freeze"/></circle><circle r="4" fill="#2DD4BF" filter="url(#glow)"><animateMotion dur="1.6s" begin="1.6s;e1m.end+4.8s" fill="freeze" id="e1m"><mpath href="#e1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="1.6s;e1m.begin" fill="freeze"/></circle><circle r="4" fill="#A78BFA" filter="url(#glow)"><animateMotion dur="1.6s" begin="3.2s;e2m.end+4.8s" fill="freeze" id="e2m"><mpath href="#e2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="3.2s;e2m.begin" fill="freeze"/></circle><circle r="4" fill="#4F7CFF" filter="url(#glow)"><animateMotion dur="1.6s" begin="4.800000000000001s;e3m.end+4.8s" fill="freeze" id="e3m"><mpath href="#e3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="4.800000000000001s;e3m.begin" fill="freeze"/></circle>
    <g><rect x="931.6" y="50" width="86.80000000000001" height="30" rx="15" fill="#0f172a" stroke="#4F7CFF" stroke-width="1.5"><animate attributeName="stroke-opacity" values="1;.35;1" dur="6.4s" begin="0.0s" repeatCount="indefinite"/></rect><text x="975" y="70" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e2e8f0">observe</text></g><g><rect x="1073.4" y="175" width="53.2" height="30" rx="15" fill="#0f172a" stroke="#2DD4BF" stroke-width="1.5"><animate attributeName="stroke-opacity" values="1;.35;1" dur="6.4s" begin="1.6s" repeatCount="indefinite"/></rect><text x="1100" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e2e8f0">act</text></g><g><rect x="935.8" y="300" width="78.4" height="30" rx="15" fill="#0f172a" stroke="#A78BFA" stroke-width="1.5"><animate attributeName="stroke-opacity" values="1;.35;1" dur="6.4s" begin="3.2s" repeatCount="indefinite"/></rect><text x="975" y="320" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e2e8f0">verify</text></g><g><rect x="810.8" y="175" width="78.4" height="30" rx="15" fill="#0f172a" stroke="#4F7CFF" stroke-width="1.5"><animate attributeName="stroke-opacity" values="1;.35;1" dur="6.4s" begin="4.800000000000001s" repeatCount="indefinite"/></rect><text x="850" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e2e8f0">reason</text></g>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="379" rx="22" fill="none" stroke="#1e293b"/>
</svg>
